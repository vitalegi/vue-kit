name: Release

# Su main: se ci sono changeset apre (o aggiorna) la PR "Version Packages";
# quando quella PR viene unita, pubblica su npmjs.com (pubblico) le versioni non ancora pubblicate,
# con provenance e con un tag git e una GitHub Release per ogni versione.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # token OIDC per la provenance di npm
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Node 24 include npm 11, necessario per la provenance
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: 'Version Packages'
          commit-message: 'Version Packages'
        env:
          # token npm di tipo "Granular" con permesso di pubblicazione sullo scope @vitalegi (secret del repository)
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
