name: Release

# Su main: se ci sono changeset apre (o aggiorna) la PR "Version Packages";
# quando quella PR viene unita, pubblica su GitHub Packages le versioni non ancora pubblicate.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@vitalegi'
      - run: pnpm install --frozen-lockfile
      # v2: commit e tag (uno per pacchetto e versione) vengono pushati tramite l'API di GitHub,
      # con una GitHub Release per ogni versione pubblicata
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: 'Version Packages'
          commit-message: 'Version Packages'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
